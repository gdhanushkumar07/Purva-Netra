[project]
name = "purva_netra"
version = "0.1.0"
description = "PURVA-NETRA: forecast-bust risk for IMD subdivisions (SIH 2026, PS 26079)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "xarray[complete]", "zarr<3", "gcsfs", "dask", "netCDF4",
  "imdlib", "geopandas", "regionmask", "shapely", "pyarrow", "duckdb",
  "scikit-learn", "lightgbm", "shap", "pyyaml", "tqdm",
  "scores", "xskillscore", "nwpeval", "xeofs",
  "fastapi", "uvicorn", "pydantic", "matplotlib",
  "pytest", "jupyter", "nbconvert", "nbformat", "ipykernel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

